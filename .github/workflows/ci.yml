name: ci

on:
  push:
    branches: [main, "rig/*"]
  pull_request:

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build app
        run: dotnet build src/EnviousWispr/EnviousWispr.csproj -c Release --nologo

      - name: Build smoke harness
        run: dotnet build src/EnviousWispr.Smoke/EnviousWispr.Smoke.csproj -c Release --nologo

      # Contract suite (prompt bytes, probe semantics, polish strip, vocab) runs
      # everywhere. The runtime ASR tests are compile-excluded here — the model
      # packs are gitignored by design and live on the dev rig.
      - name: Test
        run: dotnet test src/EnviousWispr.Tests/EnviousWispr.Tests.csproj -c Release --nologo -p:ExcludeLocalOnlyTests=true
