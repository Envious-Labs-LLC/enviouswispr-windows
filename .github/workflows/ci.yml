name: ci

on:
  push:
    branches: [main, "rig/*", "codex/*"]
  pull_request:

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Only code is public: nothing the .gitignore marks private may be tracked.
      - name: No private files tracked
        shell: pwsh
        run: |
          $tracked = @(git ls-files -ci --exclude-standard)
          if ($tracked.Count -gt 0) { "Private (gitignored) files are tracked:"; $tracked; exit 1 }

      - name: No AI attribution in commit messages
        if: github.event_name == 'pull_request'
        shell: pwsh
        run: |
          $hits = @(git log --format='%h %B' "origin/${{ github.base_ref }}..HEAD" | Select-String -Pattern '^\s*(Co-Authored-By:\s*Claude|Claude-Session:|\W{0,3}\s*Generated with \[?Claude Code)')
          if ($hits.Count -gt 0) { "AI attribution found:"; $hits; exit 1 }

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      # Canonical parity with local validation. Model runtime tests remain
      # excluded because their packs are gitignored and machine-local by design.
      - name: Validate portable build and contracts
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File scripts/validate.ps1

      # THE STORE PACKAGE IS THE ONLY THING THAT SHIPS, so every change proves it still builds and that
      # its payload is whole. The script checks the files inside the .msix, not the publish folder, and
      # launches the packaged worker; a build that only passes unpackaged has shipped nothing. #42.
      - name: Build and check the Store package
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File scripts/package-store.ps1 -OutputDirectory "$env:RUNNER_TEMP\store-package"
